    trigger: numeric_state
  - entity_id: sensor.treeow_581914_pm25
    above: 40
    for:
      minutes: 1
    trigger: numeric_state
  - entity_id: sensor.treeow_581914_pm25
    above: 60
    for:
      minutes: 1
    trigger: numeric_state
  - entity_id: sensor.treeow_581914_pm25
    above: 80
    for:
      minutes: 1
    trigger: numeric_state
  - entity_id: sensor.treeow_581914_pm25
    below: 80
    for:
      minutes: 1
    trigger: numeric_state
  - entity_id: sensor.treeow_581914_pm25
    below: 60
    for:
      minutes: 1
    trigger: numeric_state
  - entity_id: sensor.treeow_581914_pm25
    below: 40
    for:
      minutes: 1
    trigger: numeric_state
  - entity_id: sensor.treeow_581914_pm25
    below: 20
    for:
