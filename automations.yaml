- id: '1792800000008'
  alias: 客厅加湿器：早晨9点唤醒并检查
  description: 每天早晨9点自动开机，5分钟后按正常逻辑决策：湿度<50加湿，PM2.5>20净化，PM2.5<10低档，10~20保持当前状态
  triggers:
