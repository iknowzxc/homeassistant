            entity_id: sensor.treeow_531648_pm25
            below: 60
          sequence:
          - action: select.select_option
            target:
              entity_id: select.treeow_531648_fan_speed
            data:
              option: 3gear
        - conditions:
          - condition: numeric_state
            entity_id: sensor.treeow_531648_pm25
            below: 80
          sequence:
          - action: select.select_option
            target:
              entity_id: select.treeow_531648_fan_speed
            data:
              option: 4gear
        default:
        - action: select.select_option
          target:
            entity_id: select.treeow_531648_fan_speed
          data:
            option: 5gear
    - conditions:
      - condition: numeric_state
        entity_id: sensor.treeow_531648_pm25
        above: 20
      sequence:
      - action: select.select_option
        target:
          entity_id: select.treeow_531648_mode_switch
        data:
          option: mode_purify
      - action: select.select_option
        target:
          entity_id: select.treeow_531648_mode
        data:
          option: manual
      - choose:
        - conditions:
          - condition: numeric_state
            entity_id: sensor.treeow_531648_pm25
            below: 20
          sequence:
          - action: select.select_option
            target:
              entity_id: select.treeow_531648_fan_speed
            data:
              option: 1gear
        - conditions:
          - condition: numeric_state
            entity_id: sensor.treeow_531648_pm25
            below: 40
          sequence:
          - action: select.select_option
            target:
              entity_id: select.treeow_531648_fan_speed
            data:
              option: 2gear
        - conditions:
          - condition: numeric_state
            entity_id: sensor.treeow_531648_pm25
            below: 60
          sequence:
          - action: select.select_option
            target:
              entity_id: select.treeow_531648_fan_speed
            data:
              option: 3gear
        - conditions:
