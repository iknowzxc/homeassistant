- id: '1792800000005'
  alias: 客厅加湿器：按PM2.5动态调档
  description: 设备开机状态下，PM2.5越过各档位阈值时自动调档：夜间(20点-9点)及0-20为一档，20-40二档，40-60三档，60-80四档，80以上五档
  triggers:
  - entity_id: sensor.treeow_531648_pm25
    above: 20
    for:
      minutes: 2
    trigger: numeric_state
  - entity_id: sensor.treeow_531648_pm25
    above: 40
    for:
      minutes: 2
    trigger: numeric_state
  - entity_id: sensor.treeow_531648_pm25
    above: 60
    for:
      minutes: 2
    trigger: numeric_state
  - entity_id: sensor.treeow_531648_pm25
    above: 80
    for:
      minutes: 2
    trigger: numeric_state
  - entity_id: sensor.treeow_531648_pm25
    below: 80
    for:
      minutes: 2
    trigger: numeric_state
  - entity_id: sensor.treeow_531648_pm25
    below: 60
    for:
      minutes: 2
    trigger: numeric_state
  - entity_id: sensor.treeow_531648_pm25
    below: 40
    for:
      minutes: 2
    trigger: numeric_state
  - entity_id: sensor.treeow_531648_pm25
    below: 20
    for:
      minutes: 2
    trigger: numeric_state
  conditions:
  - condition: state
    entity_id: switch.treeow_531648_switch
    state: 'on'
  actions:
  - action: switch.turn_off
    target:
      entity_id: switch.treeow_531648_smart_mode_switch
  - choose:
    - conditions:
      - condition: or
        conditions:
        - condition: time
          after: '20:00:00'
          before: 09:00:00
        - condition: numeric_state
          entity_id: sensor.treeow_531648_pm25
          below: 20
      sequence:
      - action: select.select_option
        target:
          entity_id: select.treeow_531648_fan_speed
        data:
          option: 1gear
    - conditions:
      - condition: numeric_state
        entity_id: sensor.treeow_531648_pm25
        below: 40
      sequence:
      - action: select.select_option
        target:
          entity_id: select.treeow_531648_fan_speed
        data:
          option: 2gear
    - conditions:
      - condition: numeric_state
        entity_id: sensor.treeow_531648_pm25
        below: 60
      sequence:
      - action: select.select_option
        target:
          entity_id: select.treeow_531648_fan_speed
        data:
          option: 3gear
    - conditions:
      - condition: numeric_state
        entity_id: sensor.treeow_531648_pm25
        below: 80
      sequence:
      - action: select.select_option
        target:
          entity_id: select.treeow_531648_fan_speed
        data:
          option: 4gear
    default:
    - action: select.select_option
      target:
        entity_id: select.treeow_531648_fan_speed
      data:
        option: 5gear
  mode: single
