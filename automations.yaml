  description: PM2.5越过各阈值时开机/调档：0~10一档，10~20二档，20~30三档，30~40四档，40以上五档；晚上8点-早晨9点统一一档；均打开童锁
  triggers:
  - entity_id: sensor.treeow_214644_pm25
    above: 10
    for:
      minutes: 2
    trigger: numeric_state
  - entity_id: sensor.treeow_214644_pm25
    above: 20
    for:
      minutes: 2
    trigger: numeric_state
  - entity_id: sensor.treeow_214644_pm25
    above: 30
    for:
      minutes: 2
    trigger: numeric_state
  - entity_id: sensor.treeow_214644_pm25
    above: 40
    for:
      minutes: 2
    trigger: numeric_state
  - entity_id: sensor.treeow_214644_pm25
    below: 40
    for:
      minutes: 2
    trigger: numeric_state
  - entity_id: sensor.treeow_214644_pm25
    below: 30
    for:
      minutes: 2
    trigger: numeric_state
  - entity_id: sensor.treeow_214644_pm25
    below: 20
    for:
      minutes: 2
    trigger: numeric_state
  - entity_id: sensor.treeow_214644_pm25
    below: 10
    for:
      minutes: 2
    trigger: numeric_state
  actions:
  - action: switch.turn_on
    target:
      entity_id: switch.treeow_214644_switch
  - action: switch.turn_on
    target:
      entity_id: switch.treeow_214644_child_lock
  - choose:
    - conditions:
      - condition: or
        conditions:
        - condition: time
          after: '20:00:00'
          before: 09:00:00
        - condition: numeric_state
          entity_id: sensor.treeow_214644_pm25
          below: 10
      sequence:
      - action: select.select_option
        target:
          entity_id: select.treeow_214644_fan_speed_enum
        data:
          option: 2gear
    - conditions:
      - condition: numeric_state
        entity_id: sensor.treeow_214644_pm25
        below: 20
