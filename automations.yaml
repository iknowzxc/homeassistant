- id: '1792741959341'
  alias: 次卧加湿器：湿度过低开加湿+净化
  description: 湿度低于50%持续1分钟，开机并设为加湿+净化模式、一档
  triggers:
  - entity_id: sensor.treeow_311806_humidity
    below: 50
    for:
      minutes: 1
    trigger: numeric_state
  actions:
  - action: switch.turn_on
    target:
      entity_id: switch.treeow_311806_switch
  - action: switch.turn_on
    target:
      entity_id: switch.treeow_311806_child_lock
  - action: switch.turn_off
    target:
      entity_id: switch.treeow_311806_smart_mode_switch
  - action: select.select_option
    target:
      entity_id: select.treeow_311806_mode_switch
    data:
      option: mode_humidify
  - delay: '00:00:10'
  - choose:
    - conditions:
      - condition: time
        after: '20:00:00'
        before: 09:00:00
      sequence:
      - action: select.select_option
        target:
          entity_id: select.treeow_311806_mode
        data:
          option: sleep
    default:
    - action: select.select_option
      target:
        entity_id: select.treeow_311806_mode
      data:
        option: manual
  - action: select.select_option
    target:
      entity_id: select.treeow_311806_fan_speed
    data:
      option: 1gear
  mode: single
- id: '1792741974275'
  alias: 次卧加湿器：湿度达标切换净化或睡眠
  description: 湿度升到60%后：PM2.5高于20继续净化，否则进入睡眠模式
  triggers:
  - entity_id: sensor.treeow_311806_humidity
    above: 60
    for:
      minutes: 1
    trigger: numeric_state
  actions:
  - choose:
    - conditions:
      - condition: numeric_state
        entity_id: sensor.treeow_311806_pm25
        above: 20
      sequence:
      - action: switch.turn_on
        target:
          entity_id: switch.treeow_311806_switch
      - action: switch.turn_on
        target:
          entity_id: switch.treeow_311806_child_lock
      - action: switch.turn_off
        target:
          entity_id: switch.treeow_311806_smart_mode_switch
      - action: select.select_option
        target:
          entity_id: select.treeow_311806_mode_switch
        data:
          option: mode_purify
      - delay: '00:00:10'
      - choose:
        - conditions:
          - condition: time
            after: '20:00:00'
            before: 09:00:00
          sequence:
          - action: select.select_option
            target:
              entity_id: select.treeow_311806_mode
            data:
              option: sleep
        default:
        - action: select.select_option
          target:
            entity_id: select.treeow_311806_mode
          data:
            option: manual
      - action: select.select_option
        target:
          entity_id: select.treeow_311806_fan_speed
        data:
          option: 1gear
    default:
    - action: switch.turn_on
      target:
        entity_id: switch.treeow_311806_switch
    - action: switch.turn_on
      target:
        entity_id: switch.treeow_311806_child_lock
    - action: switch.turn_off
      target:
        entity_id: switch.treeow_311806_smart_mode_switch
    - action: select.select_option
      target:
        entity_id: select.treeow_311806_mode_switch
      data:
        option: mode_purify
    - delay: '00:00:10'
    - action: select.select_option
      target:
        entity_id: select.treeow_311806_mode
      data:
        option: sleep
  mode: single
- id: '1792741990335'
  alias: 次卧空气净化器：PM2.5超标自动净化
  description: PM2.5高于20持续1分钟：湿度偏低开加湿+净化，湿度正常开仅净化，均为一档
  triggers:
  - entity_id: sensor.treeow_311806_pm25
    above: 20
    for:
      minutes: 1
    trigger: numeric_state
  actions:
  - action: switch.turn_on
    target:
      entity_id: switch.treeow_311806_switch
  - action: switch.turn_on
    target:
      entity_id: switch.treeow_311806_child_lock
  - action: switch.turn_off
    target:
      entity_id: switch.treeow_311806_smart_mode_switch
  - choose:
    - conditions:
      - condition: or
        conditions:
        - condition: numeric_state
          entity_id: sensor.treeow_311806_humidity
          below: 50
        - condition: and
          conditions:
          - condition: state
            entity_id: switch.treeow_311806_switch
            state: 'on'
          - condition: state
            entity_id: select.treeow_311806_mode_switch
            state: mode_humidify
      sequence:
      - action: select.select_option
        target:
          entity_id: select.treeow_311806_mode_switch
        data:
          option: mode_humidify
      - delay: '00:00:10'
    default:
    - action: select.select_option
      target:
        entity_id: select.treeow_311806_mode_switch
      data:
        option: mode_purify
    - delay: '00:00:10'
  - choose:
    - conditions:
      - condition: time
        after: '20:00:00'
        before: 09:00:00
      sequence:
      - action: select.select_option
        target:
          entity_id: select.treeow_311806_mode
        data:
          option: sleep
    default:
    - action: select.select_option
      target:
        entity_id: select.treeow_311806_mode
      data:
        option: manual
  - action: select.select_option
    target:
      entity_id: select.treeow_311806_fan_speed
    data:
      option: 1gear
  mode: single
